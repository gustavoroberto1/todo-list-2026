<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Adventure — Corrida Infinita</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#273e72,#10172e 70%);font-family:system-ui,Arial,sans-serif;color:#fff;padding:20px}.wrap{width:min(100%,1020px)}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:15px}.brand{font-size:clamp(23px,4vw,38px);font-weight:1000;letter-spacing:-1.5px}.brand span{color:#ffd46b}.tag{font-size:12px;letter-spacing:2px;color:#9db2d8;font-weight:800}.scoreboard{display:flex;gap:12px}.pill{background:#243456;border:1px solid #405580;padding:9px 16px;border-radius:14px;font-weight:900;white-space:nowrap}.pill small{display:block;color:#a8b8d9;font-size:10px;letter-spacing:1px}.game{position:relative;border:6px solid #435b89;border-radius:20px;overflow:hidden;box-shadow:0 25px 70px #050b20a6;background:#8cddf5}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b204c8c;backdrop-filter:blur(3px)}.overlay.hidden{display:none}.card{background:#142749ed;border:2px solid #8ca9d8;border-radius:22px;text-align:center;padding:26px 40px;max-width:85%;box-shadow:0 12px 0 #09142a}.card h2{font-size:clamp(24px,5vw,46px);margin:0 0 8px;color:#ffe38c;text-shadow:3px 4px #a85e5a}.card p{color:#d3e5ff;margin:0 0 22px}.start{background:#ffd15a;color:#392b27;border:0;border-bottom:6px solid #dc8b35;padding:13px 35px;border-radius:14px;font-size:18px;font-weight:1000;cursor:pointer}.start:hover{transform:translateY(2px);border-bottom-width:4px}.help{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:#b9c9e9;font-size:13px;margin-top:16px}.key{display:inline-block;background:#2a3c60;border:1px solid #5d7199;border-bottom:3px solid #6178a5;border-radius:6px;padding:4px 9px;color:#fff;font-weight:800;margin:0 3px}.mobile{display:none;gap:10px}.mobile button{font-size:22px;border:1px solid #6581ae;background:#263f6b;color:white;padding:10px 24px;border-radius:12px}@media(max-width:680px){.top{align-items:flex-start}.scoreboard{gap:5px}.pill{padding:8px;font-size:12px}.help{justify-content:center}.mobile{display:flex}.card{padding:18px}.card p{font-size:13px}}
</style>
</head>
<body><div class="wrap"><div class="top"><div><div class="tag">UM JOGO EM HTML + JAVASCRIPT</div><div class="brand">PIXEL <span>ADVENTURE</span> ✨</div></div><div class="scoreboard"><div class="pill"><small>⭐ PONTOS</small><span id="score">00000</span></div><div class="pill"><small>🪙 MOEDAS</small><span id="coins">0</span></div><div class="pill"><small>🏆 RECORDE</small><span id="best">0</span></div></div></div><div class="game"><canvas id="game" width="960" height="500"></canvas><div id="overlay" class="overlay"><div class="card"><h2 id="headline">PRONTO PARA AVENTURA?</h2><p id="subtitle">Pule obstáculos, pegue moedas e vá cada vez mais longe!</p><button class="start" id="start">▶ JOGAR AGORA</button></div></div></div><div class="help"><div><span class="key">ESPAÇO</span> ou <span class="key">↑</span> para pular · <span class="key">P</span> para pausar</div><div class="mobile"><button id="jump">⬆ PULAR</button></div><div>🌎 Cenário infinito · 🪙 Colete moedas · 🏆 Bata seu recorde</div></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const W=canvas.width,H=canvas.height,G=405;
const scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),headline=document.getElementById('headline'),subtitle=document.getElementById('subtitle'),startBtn=document.getElementById('start');
let best=Number(localStorage.getItem('pixel-adventure-best')||0);bestEl.textContent=best;
let running=false,paused=false,dead=false,frame=0,distance=0,coins=0,speed=5.5,obstacles=[],collectibles=[],particles=[],clouds=[],hills=[];
const player={x:155,y:G-55,w:38,h:55,vy:0,grounded:true,step:0};
for(let i=0;i<9;i++)clouds.push({x:i*155+Math.random()*70,y:40+Math.random()*125,s:.6+Math.random()*.9});
for(let i=0;i<9;i++)hills.push({x:i*160,h:70+Math.random()*95,w:200+Math.random()*80});
function reset(){frame=0;distance=0;coins=0;speed=5.5;obstacles=[];collectibles=[];particles=[];player.y=G-player.h;player.vy=0;player.grounded=true;dead=false;paused=false;running=true;overlay.classList.add('hidden');updateHud()}
function updateHud(){scoreEl.textContent=String(Math.floor(distance/8)+coins*50).padStart(5,'0');coinsEl.textContent=coins}
function jump(){if(!running){if(dead||!paused)reset();else{paused=false;overlay.classList.add('hidden')}return}if(paused){paused=false;overlay.classList.add('hidden');return}if(player.grounded){player.vy=-15.2;player.grounded=false;for(let i=0;i<8;i++)particles.push({x:player.x+18,y:G,vx:(Math.random()-.5)*5,vy:-Math.random()*3,life:20,color:'#fff0a4'})}}
function gameOver(){running=false;dead=true;let score=Math.floor(distance/8)+coins*50;if(score>best){best=score;localStorage.setItem('pixel-adventure-best',best);bestEl.textContent=best}headline.textContent='FIM DE JOGO!';subtitle.textContent=`Você fez ${score} pontos e coletou ${coins} moedas. Tente novamente!`;startBtn.textContent='↻ JOGAR NOVAMENTE';overlay.classList.remove('hidden')}
function pause(){if(dead||(!running&&!paused))return;paused=!paused;overlay.classList.toggle('hidden',!paused);if(paused){headline.textContent='JOGO PAUSADO';subtitle.textContent='Sua aventura está esperando!';startBtn.textContent='▶ CONTINUAR'}}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);circle(25,20,22,'#ffffffc9');circle(55,9,29,'#ffffffdf');circle(84,21,22,'#ffffffd4');rect(25,20,60,20,'#ffffffd9');ctx.restore()}
function background(){let sky=ctx.createLinearGradient(0,0,0,G);sky.addColorStop(0,'#71b8f6');sky.addColorStop(1,'#d4f9e8');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);circle(778,91,47,'#fff1a2');circle(778,91,35,'#ffe183');clouds.forEach(c=>cloud((c.x-distance*.12%(W+190)+W+190)%(W+190)-90,c.y,c.s));hills.forEach(h=>{let x=(h.x-distance*.22%(W+260)+W+260)%(W+260)-130;ctx.fillStyle='#92d5b1';ctx.beginPath();ctx.ellipse(x+100,G+10,h.w/2,h.h,0,Math.PI,0);ctx.fill()});for(let i=0;i<8;i++){let x=(i*180-distance*.45%(W+200)+W+200)%(W+200)-100;rect(x+32,G-75,12,78,'#a66d54');circle(x+38,G-87,43,'#5fbd88');circle(x+11,G-72,27,'#4da97b');circle(x+66,G-70,28,'#78d29b')}rect(0,G,W,H-G,'#8e543d');rect(0,G,W,16,'#55b960');rect(0,G+13,W,9,'#347b46');for(let i=0;i<26;i++){let x=(i*46-distance%(46)+46)% (W+46)-30;rect(x,G+35+(i%3)*16,17,8,'#a56d4d');rect(x+14,G+76+(i%4)*9,9,7,'#71402f');rect(x+4,G-4,3,5,'#b8e36c')}}
function drawPlayer(){let x=player.x,y=player.y;ctx.save();if(!player.grounded)y+=Math.sin(frame*.16)*1.2;rect(x+7,y+42,13,13,'#343f75');rect(x+23,y+42,14,13,'#343f75');rect(x+4,y+49,19,7,'#202f5a');rect(x+23,y+49,19,7,'#202f5a');rect(x+6,y+22,31,24,'#ffb947');rect(x+10,y+23,8,13,'#ffe1a3');rect(x+2,y+28,8,17,'#f7d19d');rect(x+34,y+28,8,17,'#f7d19d');rect(x+8,y+5,30,24,'#ffd6a1');rect(x+5,y+7,36,9,'#d84f63');rect(x+10,y+0,28,10,'#e65d6e');rect(x+28,y+16,5,7,'#253453');rect(x+32,y+19,3,3,'#fff');rect(x+11,y+28,24,4,'#cb8a62');rect(x+16,y+34,5,5,'#e77b60');rect(x+29,y+34,5,5,'#e77b60');ctx.restore()}
function drawObstacle(o){let x=o.x,y=G-o.h;rect(x+4,y+8,o.w-8,o.h-8,'#a86d4a');rect(x,y+8,o.w,9,'#825037');rect(x+4,y+o.h-8,o.w-8,8,'#75492e');rect(x+7,y+19,5,o.h-30,'#ca9266');rect(x+o.w-11,y+18,5,o.h-27,'#75492e');rect(x+o.w/2-3,y+4,7,13,'#d6a67b');rect(x-4,y+o.h-13,o.w+8,8,'#77432f')}
function drawCoin(c){let y=c.y+Math.sin(frame*.12+c.phase)*5;circle(c.x,y,15,'#e6a433');circle(c.x,y,12,'#ffe17a');circle(c.x,y,9,'#f5ba40');rect(c.x-2,y-7,4,14,'#fff1a4');rect(c.x-5,y-5,8,3,'#fff1a4');rect(c.x-5,y+2,8,3,'#fff1a4')}
function sparkle(x,y){for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:28,color:i%2?'#fff7a0':'#ffc94e'})}
function update(){if(!running||paused)return;frame++;speed=Math.min(11,5.5+distance/4500);distance+=speed;player.vy+=.75;player.y+=player.vy;if(player.y+player.h>=G){player.y=G-player.h;player.vy=0;player.grounded=true}if(frame%Math.max(48,Math.floor(108-speed*5))===0){let h=30+Math.random()*35;obstacles.push({x:W+30,w:28+Math.random()*18,h});if(Math.random()<.9){let n=2+Math.floor(Math.random()*3);for(let j=0;j<n;j++)collectibles.push({x:W+60+j*39,y:G-h-75-(j%2)*17,phase:j})}}obstacles.forEach(o=>o.x-=speed);collectibles.forEach(c=>c.x-=speed);obstacles=obstacles.filter(o=>o.x+o.w>-20);collectibles=collectibles.filter(c=>c.x>-30&&!c.got);for(const o of obstacles){if(player.x+player.w-9>o.x+5&&player.x+8<o.x+o.w-5&&player.y+player.h-5>G-o.h+4&&player.y+8<G){gameOver();break}}for(const c of collectibles){if(Math.abs(player.x+player.w/2-c.x)<30&&Math.abs(player.y+player.h/2-c.y)<39){c.got=true;coins++;sparkle(c.x,c.y)}}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--});particles=particles.filter(p=>p.life>0);updateHud()}
function draw(){background();collectibles.forEach(drawCoin);obstacles.forEach(drawObstacle);drawPlayer();particles.forEach(p=>circle(p.x,p.y,Math.max(1,p.life/8),p.color));if(running){ctx.fillStyle='#ffffffa9';ctx.font='bold 15px system-ui';ctx.fillText(`DISTÂNCIA  ${Math.floor(distance/10)} m`,25,34)}}
function loop(){update();draw();requestAnimationFrame(loop)}
startBtn.onclick=()=>{if(paused){paused=false;running=true;overlay.classList.add('hidden')}else reset()};document.getElementById('jump').onclick=jump;canvas.addEventListener('pointerdown',jump);window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}if(e.code==='KeyP')pause()});draw();loop();
</script></body></html>
