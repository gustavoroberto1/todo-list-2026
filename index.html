<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List DESI</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>

<body>
    <main class="container">
        <header class="header">
            <div>
                <h1>Minhas tarefas</h1>
                <p>Organize seu dia e suas atividades</p>
            </div>

            <span class="material-symbols-outlined header-icon">
                checklist
            </span>
        </header>

        <div class="form-tarefa">
            <input 
                type="text" 
                id="input-tarefa" 
                placeholder="O que você precisa fazer?" 
                onkeydown="if (event.key === 'Enter') adicionarTarefa()"
            />

            <button type="button" onclick="adicionarTarefa()">
                <span class="material-symbols-outlined">
                    add
                </span>
                Adicionar
            </button>
        </div>

        <nav class="filtros">
            <button type="button" class="filtro ativo">Todas</button>
            <button type="button" class="filtro">Pendentes</button>
            <button type="button" class="filtro">Concluídos</button>
        </nav>

        <ul id="lista-tarefas" class="lista-tarefas"></ul>
    </main>

    
</body>

</html>
